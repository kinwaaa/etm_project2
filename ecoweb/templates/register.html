{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Register</title>
    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        /* Background video */
        .video-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -2;
        }

        /* Tint overlay */
        .video-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            z-index: -1;
        }

        /* Register container */
        .register-container {
            background-color: rgba(46, 46, 46, 0.95); /* Dark grey with transparency */
            color: white;
            max-width: 500px;
            width: 100%;
            margin: 0 auto;
            padding: 40px 20px;
            border: 1px solid #444;
            border-radius: 8px;
            box-shadow: 2px 2px 10px rgba(0,0,0,0.4);
            z-index: 1;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%); /* Centers the container */
            box-sizing: border-box; /* Ensure padding doesn't cause overflow */
        }

        h2 {
            text-align: center;
            color: #ffffff;
        }

        form {
            width: 100%;
        }

        form p {
            margin: 10px 0; /* Add margin to each form paragraph for spacing */
        }

        /* Style input fields */
        input {
            width: 100%; /* Ensure input fields take up the full width */
            padding: 10px;
            margin-top: 10px; /* Add margin to space out inputs */
            margin-bottom: 15px; /* Add margin between inputs */
            border: none;
            border-radius: 4px;
            background-color: #444;
            color: white;
            box-sizing: border-box; /* Prevent inputs from overflowing the container */
        }

        input::placeholder {
            color: #bbb;
        }

        /* Style the button */
        button {
            display: block;
            width: 100%;
            padding: 10px;
            background-color: #007BFF;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-sizing: border-box; /* Ensure button doesn't overflow */
        }

        button:hover {
            background-color: #0056b3;
        }

        /* Style links */
        a {
            text-decoration: none;
            color: #00bfff;
        }

        a:hover {
            text-decoration: underline;
        }

        /* Footer text */
        .footer-text {
            text-align: center;
            margin-top: 15px;
            color: #cccccc;
        }
    </style>
</head>
<body>
    
    <video class="video-background" autoplay muted loop>
        <source src="{% static 'vid2.mp4' %}" type="video/mp4">
        Your browser does not support the video tag.
    </video>

    <div class="video-overlay"></div>

    <div class="register-container">
        <h2>Register</h2>
        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Register</button>
        </form>
        <div class="footer-text">
            <p>Already have an account? <a href="{% url 'login' %}">Login</a></p>
            <a href="{% url 'main_html' %}">Back to Home</a>

        </div>
    </div>
</body>
</html>
