{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        /* Background video */
        .video-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -2;
        }

        /* Tint overlay */
        .video-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6); /* Tint */
            z-index: -1;
        }

        /* Center container */
        .login-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: rgba(46, 46, 46, 0.9); /* Slight transparency */
            color: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 2px 2px 10px rgba(0,0,0,0.4);
            width: 100%;
            max-width: 400px;
            z-index: 1;
            box-sizing: border-box; /* Ensures padding is included in the element's width/height */
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
        }

        form p {
            margin-bottom: 15px;
        }

        /* Style input fields */
        input {
            width: 100%;
            padding: 10px;
            margin-top: 10px; /* Space between fields */
            margin-bottom: 15px; /* Space between input and button */
            border: none;
            border-radius: 4px;
            background-color: #444;
            color: white;
            box-sizing: border-box; /* Prevent inputs from overflowing the container */
        }

        input::placeholder {
            color: #bbb;
        }

        /* Style the button */
        button {
            width: 100%;
            padding: 10px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            box-sizing: border-box; /* Prevent button from overflowing */
        }

        button:hover {
            background-color: #388e3c;
        }

        /* Style links */
        a {
            text-decoration: none;
            color: #00bfff;
        }

        a:hover {
            text-decoration: underline;
        }

        /* Footer text */
        p {
            text-align: center;
            color: #cccccc;
        }
    </style>
</head>
<body>
   
    <video class="video-background" autoplay muted loop>
        <source src="{% static 'vid2.mp4' %}" type="video/mp4">
        Your browser does not support the video tag.
    </video>

    <div class="video-overlay"></div>

    <div class="login-container">
        <h2>Login</h2>
        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Login</button>
        </form>
        <p>Don't have an account? <a href="{% url 'register' %}">Register here</a></p>
        <a href="{% url 'main_html' %}">Back to Home</a>

    </div>
</body>
</html>
